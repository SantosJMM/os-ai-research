[package]
name = "sasp-mcp-demo"
version = "0.1.0"
edition = "2024"
publish = false
description = "Experimental SASP semantic provider exposed through MCP"

[dependencies]
rmcp = { version = "=3.11.0", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
anyhow = "1"
